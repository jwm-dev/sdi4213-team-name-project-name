[pytest]
testpaths = tests
markers =
    l0: in-process, no I/O (default run)
    l1: needs a real dependency such as a database
    l2: over HTTP against a running instance (local uvicorn, or BASE_URL)
# Plain `pytest` runs the fast levels; `pytest -m l2` runs the HTTP suite.
addopts = -m "not l2"
filterwarnings =
    ignore::DeprecationWarning
