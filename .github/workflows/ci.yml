name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least-privilege token: this job only reads the repo.
permissions:
  contents: read

jobs:
  test:
    name: test (L0 + L2)
    runs-on: ubuntu-latest
    steps:
      # Actions pinned to commit SHAs, not mutable tags (see Week 2 lecture).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Run the test tiers
        run: make ci
